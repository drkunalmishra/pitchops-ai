[project]
name = "pitchops"
version = "0.1.0"
description = "PitchOps AI — sales-content intelligence for Dubai real estate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-cloud-bigquery>=3.25",
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=2.18",
  "google-cloud-secret-manager>=2.20",
  "google-cloud-texttospeech>=2.17",
  "google-genai>=1.0",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "pydantic-settings>=2.4",
  "tenacity>=9.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "firebase-admin>=6.5",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitchops"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"services/api/*.py" = ["B008"]
"scripts/gen_bq_schemas.py" = ["E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["pitchops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
